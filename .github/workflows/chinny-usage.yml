# Chinny usage probe: a tiny Codex CLI call that reads the Stanford ChatGPT plan's limits (5-hour and weekly
# used %) from the session rollout and posts CODEX-USAGE on the Chinny tracking issue, so HQ can draw Chinny's ring
# even when no coding run happened recently. Costs a few hundred tokens per probe. Hourly, so the supervisor can pace Chinny through the week.
name: Chinny usage probe
on:
  schedule: [{ cron: "17 * * * *" }]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TRACK: "11"
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Probe
        env: { CODEX_AUTH_JSON: "${{ secrets.CODEX_AUTH_JSON }}" }
        run: |
          [ -n "$CODEX_AUTH_JSON" ] || { echo "::error::Add repo secret CODEX_AUTH_JSON"; exit 1; }
          npm i -g @openai/codex >/dev/null
          mkdir -p ~/.codex && printf '%s' "$CODEX_AUTH_JSON" > ~/.codex/auth.json && chmod 600 ~/.codex/auth.json
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 >/dev/null || true
          cd "$(mktemp -d)" && git init -q
          codex exec --sandbox read-only --skip-git-repo-check "Reply with the single word OK." 2>&1 | tail -5 || true
          ro=$(ls -t ~/.codex/sessions/*/*/*/rollout-*.jsonl 2>/dev/null | head -1)
          [ -n "$ro" ] || { echo "no rollout file"; exit 0; }
          rl=$(jq -c '..|objects|select(has("rate_limits"))|.rate_limits|select(.!=null)' "$ro" | tail -1)
          [ -n "$rl" ] || { echo "no rate_limits in rollout"; exit 0; }
          p5=$(echo "$rl" | jq -r '.primary.used_percent // "?"'); pw=$(echo "$rl" | jq -r '.secondary.used_percent // "?"')
          m5=$(echo "$rl" | jq -r '.primary.window_minutes // "?"'); mw=$(echo "$rl" | jq -r '.secondary.window_minutes // "?"')
          rw=$(echo "$rl" | jq -r '.secondary.resets_at // empty'); [ -n "$rw" ] || { rs=$(echo "$rl" | jq -r '.secondary.resets_in_seconds // empty'); [ -n "$rs" ] && rw=$(date -u -d "+${rs} seconds" +%Y-%m-%dT%H:%M:%SZ); }
          case "$rw" in ''|*[!0-9]*) ;; *) rw=$(date -u -d "@$rw" +%Y-%m-%dT%H:%M:%SZ);; esac
          echo "limits: 5h=$p5% week=$pw% ($m5m/$mw m)"
          gh issue comment "$TRACK" -R "$GITHUB_REPOSITORY" --body "CODEX-USAGE probe=1 tokens=0 limit_5h_pct=$p5 limit_week_pct=$pw windows=${m5}m/${mw}m week_reset=${rw:-?} run=${{ github.run_id }} repo=$GITHUB_REPOSITORY"
